<mat-sidenav-container class="layout-sidenav-container">

  <mat-sidenav
    *ngIf="isMobile"
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="mobile-menu"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/favorites" routerLinkActive="active-link">
        <mat-icon>favorite</mat-icon>
        <span>Faves</span>
      </a>
      <a mat-list-item routerLink="/cart" routerLinkActive="active-link">
        <mat-icon>shopping_cart</mat-icon>
        <span>Cart</span>
      </a>
    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    <app-header-content (toggleSidenav)="sidenav.toggle()"></app-header-content>
    <main class="main-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>

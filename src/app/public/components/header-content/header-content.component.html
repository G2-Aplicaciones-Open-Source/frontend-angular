<mat-toolbar>
  <!-- Burger menu button - Only visible in mobile devices -->
  <button
    mat-icon-button
    *ngIf="isMobile"
    (click)="toggleSidenav.emit()"
    aria-label="Open menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <a class="logo-container" routerLink="/home">
    <img
      ngSrc="logos/FitWiseNoBG.png"
      width="100"
      height="50"
      alt="TravelMatch Logo"
      priority
    />
  </a>

  <span class="spacer"></span>

  <!-- Main navigation - Not visible in mobile devices -->
  <div class="nav-links" [class.is-mobile]="isMobile">
    <a mat-button routerLink="/favorites" routerLinkActive="active-link">
      <mat-icon>favorite</mat-icon>
      <span>Faves</span>
    </a>
    <a mat-button routerLink="/cart" routerLinkActive="active-link">
      <mat-icon>shopping_cart</mat-icon>
      <span>Cart</span>
    </a>
  </div>

  <!-- Menu button - Always visible -->
  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User options">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <ng-container>
      <button mat-menu-item disabled>
        <mat-icon>person</mat-icon>
        <span>Welcome, {{ currentEmail }}</span>
      </button>
      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>manage_accounts</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="onSignOut()">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </ng-container>
  </mat-menu>
</mat-toolbar>
